name: Refresh planetary names
on:
  schedule:
    - cron: '38 7 2 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gazetteer-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Retrieve, validate and build the new release
        run: |
          python3 scripts/refresh.py
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py
      - name: Preserve the snapshot and request the normal browser checks and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/data/gazetteer.json.gz
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Moon and Mars gazetteer snapshot'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main
